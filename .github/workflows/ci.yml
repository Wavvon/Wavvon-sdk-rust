name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  WIRE_VECTORS_REF: 78ff4aab3ba905ef4480d02d47f24d63762cc697

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Fetch conformance vectors
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Wavvon/Wavvon-server/${WIRE_VECTORS_REF}/crates/identity/wire-vectors.json" -o "$RUNNER_TEMP/wire-vectors.json"
          echo "WAVVON_WIRE_VECTORS=$RUNNER_TEMP/wire-vectors.json" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
